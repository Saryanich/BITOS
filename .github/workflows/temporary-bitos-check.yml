name: Temporary BITOS final syntax check
on:
  push:
    branches: [main]
    paths:
      - "BETA 06V6.py"
      - ".github/workflows/temporary-bitos-check.yml"
permissions:
  contents: read
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile
        run: python -m py_compile "BETA 06V6.py"
