name: Temporary BITOS syntax validation
on:
  push:
    branches:
      - main
    paths:
      - "BETA 06V6.py"
      - ".github/workflows/temporary-bitos-pycompile.yml"
permissions:
  contents: read
jobs:
  py-compile:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile BITOS source
        run: python -m py_compile "BETA 06V6.py"
